<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumen-wallframe</title>
<style>
  :root {
    --ink: #141210;
    --cream: #f4f0e8;
    --muted: #a39e93;
    --amber: #e7b15a;
    --card: #221f1b;
    --wall-ink: #f4f0e8;
    --wall-halo: 0 2px 8px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0908; color: var(--cream); font-family: "DejaVu Sans", "Liberation Sans", sans-serif; }
  #stage { position: fixed; inset: 0; background: #0a0908; }
  .layer { position: absolute; inset: 0; display: flex; gap: 8px; padding: 8px; opacity: 0; transition: opacity .8s ease; }
  .layer.on { opacity: 1; }
  .layer.single { padding: 0; gap: 0; }
  .slot { position: relative; min-width: 0; flex: 1; overflow: hidden; border-radius: 18px; background: #141210 center/cover no-repeat; }
  .layer.single .slot { border-radius: 0; }
  .layer.single.portrait .slot { background-size: contain; }
  .blur {
    position: absolute; inset: -8%;
    background: inherit;
    background-size: cover;
    filter: blur(28px);
    transform: scale(1.08);
    opacity: 0.7;
  }
  .layer.single.portrait .slot .photo { position: absolute; inset: 0; background: center/contain no-repeat; }
  .band { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 1; }
  .band.top { top: 0; }
  .band.bottom { bottom: 0; }
  .hud {
    position: fixed; left: 4vw; right: 4vw; bottom: 4vh; z-index: 2;
    display: flex; align-items: flex-end; justify-content: space-between;
    color: var(--wall-ink); text-shadow: var(--wall-halo);
    pointer-events: none;
  }
  .time { font-weight: 300; font-size: clamp(48px, 9vw, 112px); letter-spacing: -0.04em; line-height: 0.85; font-variant-numeric: tabular-nums; }
  .day { margin-top: 10px; font-size: clamp(14px, 2vw, 26px); opacity: 0.92; }
  .temp { font-weight: 300; font-size: clamp(32px, 5vw, 64px); letter-spacing: -0.04em; line-height: 0.9; text-align: right; }
  .cond, .where { font-size: clamp(12px, 1.5vw, 18px); text-align: right; opacity: 0.9; }
  .where { letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; margin-top: 4px; }
  #bar {
    position: fixed; top: 12px; right: 14px; z-index: 3;
    display: flex; align-items: center; gap: 2px;
    color: var(--wall-ink); text-shadow: var(--wall-halo);
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
  }
  #bar .link, #bar .dot { opacity: 0.75; }
  .link { background: transparent; color: inherit; border: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; text-shadow: inherit; cursor: pointer; padding: 6px 6px; }
  .link:hover { opacity: 1; }
  /* Dropdowns open right under their label: the menu is positioned inside the label's box. */
  .menu-wrap { position: relative; display: inline-block; }
  .menu {
    position: absolute; top: 100%; right: 0; margin-top: 4px; z-index: 10; display: none;
    min-width: 150px; padding: 6px 0; border-radius: 12px;
    background: rgba(28,25,22,.98); box-shadow: 0 8px 28px rgba(0,0,0,.45);
    text-transform: none; letter-spacing: normal; text-shadow: none;
  }
  .menu.left { right: auto; left: 0; }
  .menu.on { display: block; }
  .menu button {
    display: block; width: 100%; text-align: left; padding: 9px 16px; border: 0; background: transparent;
    color: var(--cream); font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .menu button:hover { background: rgba(231,177,90,.16); }
  .menu button.on { color: var(--amber); font-weight: 700; }
  #sheet {
    position: fixed; z-index: 4; top: 0; bottom: 0; left: 0; width: min(420px, 100%);
    background: rgba(20,18,16,.96); padding: 22px 22px 40px; overflow: auto;
    transform: translateX(-105%); transition: transform .25s ease;
  }
  #sheet.on { transform: none; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; }
  .brand { letter-spacing: .2em; font-size: 12px; color: var(--amber); }
  #sheetLang { color: var(--muted); font-size: 13px; }
  h1 { font-weight: 400; font-size: 28px; margin: 8px 0; }
  p { color: var(--muted); line-height: 1.45; font-size: 14px; }
  #count { color: var(--cream); }
  button.act, button.choice {
    display: block; width: 100%; margin: 8px 0; padding: 12px 14px;
    border-radius: 12px; border: 0; font: inherit; cursor: pointer;
  }
  button.act { background: var(--amber); color: #1a140c; }
  button.choice { background: var(--card); color: var(--cream); }
  button.choice.on { outline: 1px solid var(--amber); }
  #intervals { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  #sheet label { display: block; margin-top: 6px; }
  #intervals button.choice { width: auto; flex: 1 0 28%; margin: 0; }
  code { font-size: 28px; letter-spacing: 0.12em; color: var(--amber); }
  a { color: var(--amber); }
  input[type=text], input:not([type]) {
    width: 100%; margin: 6px 0 12px; padding: 10px 12px; border-radius: 10px;
    border: 0; background: var(--card); color: var(--cream); font: inherit;
  }
  .err { color: #e7b15a; min-height: 1.2em; }
  #empty {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 1;
    padding: 32px; text-align: center; color: var(--muted);
  }
  #empty.on { display: flex; }
  /* Customize dialog */
  #customize {
    position: fixed; inset: 0; z-index: 6; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.35); padding: 16px;
  }
  #customize.on { display: flex; }
  .dialog {
    width: min(900px, 100%); max-height: 100%; overflow: auto; border-radius: 22px; padding: 22px 24px 16px;
    background: #2a2622; color: var(--cream); box-shadow: 0 18px 60px rgba(0,0,0,.5);
  }
  .dialog h2 { font-weight: 400; font-size: 22px; margin: 0 0 14px; }
  .dialog-body { display: flex; gap: 24px; flex-wrap: wrap; }
  .preview { position: relative; flex: 1 1 300px; aspect-ratio: 1.6; min-height: 160px; border-radius: 12px; overflow: hidden; background: #000 center/cover no-repeat; }
  .preview .band { position: absolute; z-index: 0; }
  .preview .pclock { position: absolute; left: 12px; bottom: 10px; font-size: 28px; font-weight: 300; }
  .preview .pbar { position: absolute; right: 10px; top: 8px; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
  .controls { flex: 1 1 300px; }
  .controls label { display: block; margin: 10px 0 2px; font-size: 14px; }
  .controls input[type=range] { width: 100%; accent-color: var(--amber); }
  .swatches { display: flex; gap: 10px; margin: 6px 0 4px; flex-wrap: wrap; }
  .swatch { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #8a8076; padding: 2px; background-clip: content-box; cursor: pointer; }
  .swatch.on { border: 3px solid var(--amber); padding: 4px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 14px; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--amber); }
  .divider { height: 1px; background: #3a3530; margin: 14px 0 6px; }
  .place-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .place-row input { flex: 1; min-width: 0; }
  .place-row button {
    flex: 0 0 auto; background: var(--amber); color: #1a140c; border: 0; border-radius: 10px;
    font: inherit; padding: 10px 14px; cursor: pointer;
  }
  .place-row button:disabled { opacity: .5; cursor: default; }
  .place-now { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .place-status { font-size: 13px; color: var(--amber); margin-top: 4px; min-height: 1.2em; }
  .preview .pweather { position: absolute; right: 12px; bottom: 10px; font-size: 12px; font-weight: 400; }
  .hud .clock-wrap[hidden], .hud .weather-wrap[hidden] { display: none !important; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .dialog-actions button { background: transparent; border: 0; color: var(--amber); font: inherit; padding: 10px 14px; cursor: pointer; border-radius: 10px; }
  .dialog-actions button:hover { background: rgba(231,177,90,.12); }
</style>
</head>

  <div id="empty"></div>

  </div>
  <div id="bar">

    <button class="link" id="open" type="button">Painel</button>
    <span class="dot">·</span>
    <span class="menu-wrap"><button class="link" type="button" id="barPace" data-menu="pace"></button><span class="menu" id="menuPace"></span></span>
  </div>
  <aside id="sheet">
    <div class="sheet-head">
      <div class="brand">LUMEN-WALLFRAME</div>
      <span class="menu-wrap"><button class="link" type="button" id="sheetLang" data-menu="lang"></button><span class="menu" id="menuSheetLang"></span></span>
    </div>
    <h1 id="sheetTitle">Parede</h1>
    <p id="sheetLead"></p>
    <p id="count"></p>
    <label id="albumLabel">Link do álbum</label>
    <input id="album" placeholder="https://photos.app.goo.gl/…" />
    <button class="act" id="albumGo" type="button">Obter álbum</button>
    <p class="err" id="msg"></p>
    <button class="choice" id="customizeOpen" type="button">Personalizar</button>
    <p id="paceLabel">Ritmo</p>
    <div id="intervals"></div>
    <label id="entityLabel">Sensor de temperatura interior (opcional)</label>
    <input id="entity" placeholder="sensor.temperatura_sala" />
    <button class="choice" id="saveEntity" type="button">Guardar sensor</button>
    <button class="choice" id="link" type="button">Ou ligar a conta e escolher à mão</button>
    <p id="codewrap" hidden><span id="codeLead"></span> <span id="vurl"></span> · <code id="code"></code></p>
    <button class="choice" id="pick" type="button">Escolher fotos</button>
    <p id="picklink" hidden><a id="picker" target="_blank" rel="noopener">Abrir a escolha no telemóvel</a></p>
    <button class="choice" id="close" type="button">Fechar</button>
  </aside>
  <div id="customize" role="dialog" aria-modal="true" aria-labelledby="customizeTitle">
    <div class="dialog">
      <h2 id="customizeTitle">Personalizar a parede</h2>
      <div class="dialog-body">
        <div class="preview" id="preview">
          <div class="band top" id="pTop"></div>
          <div class="band bottom" id="pBottom"></div>
          <div class="pbar" id="pBar"></div>
          <div class="pclock" id="pClock">12:34</div>
          <div class="pweather" id="pWeather">18° · Coimbra</div>
        </div>
        <div class="controls">
          <label for="oTop" id="oTopLabel"></label>
          <input type="range" id="oTop" min="0" max="60" step="1" />
          <label for="oBottom" id="oBottomLabel"></label>
          <input type="range" id="oBottom" min="0" max="100" step="1" />
          <label id="oColorLabel"></label>
          <div class="swatches" id="swatches"></div>
          <label for="oOpacity" id="oOpacityLabel"></label>
          <input type="range" id="oOpacity" min="0" max="100" step="1" />
          <div class="toggle"><span id="oFadeLabel"></span><input type="checkbox" id="oFade" /></div>
          <div class="divider"></div>
          <div class="toggle"><span id="oClockLabel"></span><input type="checkbox" id="oClock" /></div>
          <div class="toggle"><span id="oWeatherLabel"></span><input type="checkbox" id="oWeather" /></div>
          <label for="oPlace" id="oPlaceLabel"></label>
          <div class="place-row">
            <input id="oPlace" type="text" autocomplete="off" />
            <button type="button" id="oPlaceFind">Procurar</button>
          </div>
          <div class="place-now" id="oPlaceNow"></div>
          <div class="place-status" id="oPlaceStatus"></div>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" id="oReset">Repor</button>
        <button type="button" id="oDone">Concluído</button>
      </div>
    </div>
  </div>

    $("clock").textContent = time;
    $("pClock").textContent = time;
    $("day").textContent = day;
    var showClock = state.show_clock !== false;
    var showWeather = state.show_weather !== false;
    $("clockWrap").hidden = !showClock;
    $("weatherWrap").hidden = !showWeather;
    var w = state.weather || {};
    var placeName = (state.place && state.place.name) || w.place || "Coimbra";
    $("temp").textContent = w.temp == null ? "––°" : Math.round(w.temp) + "°";
    $("cond").textContent = c["w_" + (w.key || "unavailable")] || "";
    $("where").textContent = w.indoor == null ? placeName : (placeName + " · " + c.indoors + " " + w.indoor + "°");
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-menu]"), function (button) {
    button.onclick = function (event) {
      event.stopPropagation();
      var menu = button.parentNode.querySelector(".menu");
      var open = menu.classList.contains("on");
      closeMenus();
      if (!open) menu.classList.add("on");
    };
  });
  document.addEventListener("click", closeMenus);

  $("albumGo").onclick = function () {
    say(tr("reading"));
    post({ action: "album_refresh", url: $("album").value }).then(function (res) {
      state.total = res.total; state.cached = res.cached;
      say(tr("album_counts", res.total, res.cached));
      load();
      schedule(50);
    }).catch(function (err) { say(errText(err)); });
  };
  $("open").onclick = function (event) { event.stopPropagation(); $("sheet").classList.add("on"); };
  $("close").onclick = function () { $("sheet").classList.remove("on"); };
  $("link").onclick = function () {
    say(tr("asking"));
    post({ action: "device_start" }).then(function (data) {
      $("codewrap").hidden = false;
      $("code").textContent = data.user_code || "";
      $("vurl").textContent = data.verification_url || "";
      say(tr("waiting_phone"));
      if (polling) clearInterval(polling);
      polling = setInterval(function () {
        post({ action: "device_poll" }).then(function (res) {
          if (res.connected) {
            clearInterval(polling);
            say(tr("linked"));
          } else if (res.error) {
            clearInterval(polling);
            say(errText(res));
          }
        }).catch(function (err) { clearInterval(polling); say(errText(err)); });
      }, 5000);
    }).catch(function (err) { say(errText(err)); });
  };
  $("pick").onclick = function () {
    say(tr("opening_pick"));
    post({ action: "picker_start" }).then(function (data) {
      $("picklink").hidden = false;
      $("picker").href = data.picker_uri;
      say(tr("confirm_phone"));
      if (polling) clearInterval(polling);
      polling = setInterval(function () {
        post({ action: "picker_poll" }).then(function (res) {
          if (res.waiting) return;
          if (res.error) { clearInterval(polling); say(errText(res)); return; }
          say(tr("transfer", res.have || 0, res.total || 0));
          if (res.done) {
            clearInterval(polling);
            say(tr("picked"));
            load();
            schedule(50);
          }
        }).catch(function (err) { clearInterval(polling); say(errText(err)); });
      }, 2500);
    }).catch(function (err) { say(errText(err)); });
  };
  $("saveEntity").onclick = function () {
    post({ action: "entity", entity: $("entity").value }).then(function () {
      say(tr("sensor_saved"));
      load();
    }).catch(function (err) { say(errText(err)); });
  };
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeMenus();
      if ($("customize").classList.contains("on")) $("oDone").onclick();
      else $("sheet").classList.remove("on");
    }
  });
  setInterval(clock, 1000);
  setInterval(load, 60000);
  applyStyle();
  applyLang();
  load().then(function () { tick(); });
})();
</script>
</body>
</html>
